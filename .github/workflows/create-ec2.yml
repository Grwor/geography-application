name: Create EC2 Instance

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  INSTANCE_NAME: geography-actions
  INSTANCE_TYPE: t3.micro
  SECURITY_GROUP_NAME: geography-actions-sg

jobs:
  create-ec2:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check AWS connection
        run: aws sts get-caller-identity

      - name: Find or create EC2 instance
        id: ec2
        shell: bash
        env:
          KEY_PAIR_NAME: ${{ vars.AWS_KEY_PAIR_NAME }}
        run: |
          set -euo pipefail

          echo "Searching for existing instance..."

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$INSTANCE_NAME" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)

          if [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]]; then
            echo "Existing instance found: $INSTANCE_ID"

            STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text)

            echo "Current state: $STATE"

            if [[ "$STATE" == "stopping" ]]; then
              aws ec2 wait instance-stopped \
                --instance-ids "$INSTANCE_ID"
              STATE="stopped"
            fi

            if [[ "$STATE" == "stopped" ]]; then
              aws ec2 start-instances \
                --instance-ids "$INSTANCE_ID"
            fi
          else
            echo "Creating a new EC2 instance..."

            AMI_ID=$(aws ec2 describe-images \
              --owners 099720109477 \
              --filters \
                "Name=name,Values=ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*" \
                "Name=architecture,Values=x86_64" \
                "Name=state,Values=available" \
                "Name=virtualization-type,Values=hvm" \
              --query 'sort_by(Images, &CreationDate)[-1].ImageId' \
              --output text)

            if [[ -z "$AMI_ID" || "$AMI_ID" == "None" ]]; then
              echo "Ubuntu AMI was not found"
              exit 1
            fi

            echo "AMI: $AMI_ID"

            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=isDefault,Values=true" \
              --query 'Vpcs[0].VpcId' \
              --output text)

            if [[ -z "$VPC_ID" || "$VPC_ID" == "None" ]]; then
              echo "Default VPC was not found"
              exit 1
            fi

            echo "VPC: $VPC_ID"

            SUBNET_ID=$(aws ec2 describe-subnets \
              --filters \
                "Name=vpc-id,Values=$VPC_ID" \
                "Name=default-for-az,Values=true" \
              --query 'Subnets[0].SubnetId' \
              --output text)

            if [[ -z "$SUBNET_ID" || "$SUBNET_ID" == "None" ]]; then
              echo "Default subnet was not found"
              exit 1
            fi

            echo "Subnet: $SUBNET_ID"

            SG_ID=$(aws ec2 describe-security-groups \
              --filters \
                "Name=group-name,Values=$SECURITY_GROUP_NAME" \
                "Name=vpc-id,Values=$VPC_ID" \
              --query 'SecurityGroups[0].GroupId' \
              --output text)

            if [[ -z "$SG_ID" || "$SG_ID" == "None" ]]; then
              SG_ID=$(aws ec2 create-security-group \
                --group-name "$SECURITY_GROUP_NAME" \
                --description "Security group for Geography GitHub Actions homework" \
                --vpc-id "$VPC_ID" \
                --query 'GroupId' \
                --output text)

              echo "Created security group: $SG_ID"
            else
              echo "Using existing security group: $SG_ID"
            fi

            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" \
              --protocol tcp \
              --port 22 \
              --cidr 0.0.0.0/0 2>/dev/null || true

            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" \
              --protocol tcp \
              --port 80 \
              --cidr 0.0.0.0/0 2>/dev/null || true

            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" \
              --protocol tcp \
              --port 4000 \
              --cidr 0.0.0.0/0 2>/dev/null || true

            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id "$AMI_ID" \
              --instance-type "$INSTANCE_TYPE" \
              --key-name "$KEY_PAIR_NAME" \
              --security-group-ids "$SG_ID" \
              --subnet-id "$SUBNET_ID" \
              --associate-public-ip-address \
              --count 1 \
              --tag-specifications \
                "ResourceType=instance,Tags=[{Key=Name,Value=$INSTANCE_NAME},{Key=Project,Value=geography},{Key=CreatedBy,Value=github-actions}]" \
              --query 'Instances[0].InstanceId' \
              --output text)

            echo "Created instance: $INSTANCE_ID"
          fi

          echo "Waiting for instance to start..."

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          PUBLIC_DNS=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicDnsName' \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "public_dns=$PUBLIC_DNS" >> "$GITHUB_OUTPUT"

      - name: Show EC2 information
        shell: bash
        run: |
          echo "Instance ID: ${{ steps.ec2.outputs.instance_id }}"
          echo "Public IP: ${{ steps.ec2.outputs.public_ip }}"
          echo "Public DNS: ${{ steps.ec2.outputs.public_dns }}"

          {
            echo "## EC2 instance created"
            echo ""
            echo "- Instance ID: \`${{ steps.ec2.outputs.instance_id }}\`"
            echo "- Public IP: \`${{ steps.ec2.outputs.public_ip }}\`"
            echo "- Public DNS: \`${{ steps.ec2.outputs.public_dns }}\`"
            echo "- Region: \`${{ vars.AWS_REGION }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
