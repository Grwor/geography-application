name: Build and Push Docker Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        shell: bash
        run: echo "TAG_NAME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build DB image
        shell: bash
        run: |
          docker build ./01_DB \
            --file ./01_DB/Dockerfile.single \
            --tag ${{ vars.DOCKERHUB_USERNAME }}/geo-db:$TAG_NAME \
            --tag ${{ vars.DOCKERHUB_USERNAME }}/geo-db:latest

      - name: Push DB image
        shell: bash
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/geo-db:$TAG_NAME
          docker push ${{ vars.DOCKERHUB_USERNAME }}/geo-db:latest

      - name: Build Server image
        shell: bash
        run: |
          docker build ./02_Server \
            --file ./02_Server/Dockerfile.single \
            --tag ${{ vars.DOCKERHUB_USERNAME }}/geo-server:$TAG_NAME \
            --tag ${{ vars.DOCKERHUB_USERNAME }}/geo-server:latest

      - name: Push Server image
        shell: bash
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/geo-server:$TAG_NAME
          docker push ${{ vars.DOCKERHUB_USERNAME }}/geo-server:latest
